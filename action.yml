name: "Agent Failure Analyzer"
description: "Analyze AI agent session logs for failures and quality issues"
author: "Cobus Greyling"

branding:
  icon: "alert-triangle"
  color: "red"

inputs:
  path:
    description: "Path to log file(s) or directory"
    required: true
  max-risk:
    description: "Maximum acceptable risk score (0.0-1.0)"
    required: false
    default: "0.5"
  max-failures:
    description: "Maximum acceptable failure count"
    required: false
    default: ""
  min-severity:
    description: "Minimum severity to report (info, low, medium, high, critical)"
    required: false
    default: "info"
  min-confidence:
    description: "Minimum confidence threshold (0.0-1.0)"
    required: false
    default: "0.0"
  format:
    description: "Output format (terminal, json, csv, html, markdown)"
    required: false
    default: "terminal"
  output-file:
    description: "Path to write report file"
    required: false
    default: ""
  python-version:
    description: "Python version to use"
    required: false
    default: "3.12"

outputs:
  risk-score:
    description: "Maximum risk score across all analyzed sessions"
  failure-count:
    description: "Total number of failures detected"
  session-count:
    description: "Number of sessions analyzed"
  passed:
    description: "Whether the quality gate passed (true/false)"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Agent Failure Analyzer
      shell: bash
      run: pip install agent-failure-analyzer

    - name: Run analysis
      id: analyze
      shell: bash
      env:
        AFA_PATH: ${{ inputs.path }}
        AFA_MIN_SEVERITY: ${{ inputs.min-severity }}
        AFA_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        AFA_FORMAT: ${{ inputs.format }}
        AFA_OUTPUT_FILE: ${{ inputs.output-file }}
        AFA_MAX_RISK: ${{ inputs.max-risk }}
        AFA_MAX_FAILURES: ${{ inputs.max-failures }}
      run: |
        set +e

        ARGS="--min-severity ${AFA_MIN_SEVERITY}"
        ARGS="$ARGS --min-confidence ${AFA_MIN_CONFIDENCE}"

        if [ -n "${AFA_OUTPUT_FILE}" ]; then
          ARGS="$ARGS --format ${AFA_FORMAT} --output ${AFA_OUTPUT_FILE}"
        fi

        afa analyze "${AFA_PATH}" $ARGS 2>&1
        ANALYZE_EXIT=$?

        # Run check command for gate
        CHECK_ARGS="--max-risk ${AFA_MAX_RISK}"
        if [ -n "${AFA_MAX_FAILURES}" ]; then
          CHECK_ARGS="$CHECK_ARGS --max-failures ${AFA_MAX_FAILURES}"
        fi

        CHECK_OUTPUT=$(afa check "${AFA_PATH}" $CHECK_ARGS 2>&1)
        CHECK_EXIT=$?

        echo "check-output=$CHECK_OUTPUT" >> "$GITHUB_OUTPUT"

        if [ $CHECK_EXIT -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
          exit 1
        fi

    - name: Upload report artifact
      if: inputs.output-file != ''
      uses: actions/upload-artifact@v4
      with:
        name: agent-failure-report
        path: ${{ inputs.output-file }}
