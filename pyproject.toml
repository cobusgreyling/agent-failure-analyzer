[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-failure-analyzer"
version = "0.1.0"
description = "Classify and analyze AI agent session failures across frameworks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Cobus Greyling", email = "greyling.cobus@gmail.com" },
]
keywords = ["ai", "agents", "failure-analysis", "observability", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "orjson>=3.9",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
afa = "agent_failure_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["agent_failure_analyzer*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
