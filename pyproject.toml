[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-failure-analyzer"
version = "0.4.0"
description = "Classify and analyze AI agent session failures across frameworks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Cobus Greyling", email = "greyling.cobus@gmail.com" },
]
keywords = ["ai", "agents", "failure-analysis", "observability", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "orjson>=3.9",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
llm = [
    "anthropic>=0.40",
]
pdf = [
    "weasyprint>=62.0",
]
otel = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
afa = "agent_failure_analyzer.cli:main"

# Plugin entry-point group for third-party parsers.
# External packages can register parsers by adding an entry like:
#
#   [project.entry-points."afa.parsers"]
#   myframework = "mypackage.parser:MyFrameworkParser"
#
# The class must subclass agent_failure_analyzer.parsers.base.BaseParser.

[tool.setuptools.packages.find]
include = ["agent_failure_analyzer*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"agent_failure_analyzer/dashboard/app.py" = ["E501"]
"agent_failure_analyzer/reports/html_report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_redundant_casts = true
# strict_optional defaults to true; keep it on to catch None-on-Optional bugs.
# warn_unused_ignores is off because several `type: ignore` comments are needed
# only on older Python versions (e.g. tomllib fallback, entry_points API change).

[tool.coverage.run]
source = ["agent_failure_analyzer"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
